[package]
name = "obsy-launcher"
version = "0.1.3"
description = "Obsy Launcher - A modern cross-platform Minecraft launcher"
authors = ["obsy-official"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "obsy_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.11", features = ["v3", "v4"] }
reqwest = { version = "0.13.4", features = ["json", "multipart"] }
base64 = "0.22.1"
tokio = { version = "1.52.3", features = ["full"] }
dirs = "6.0.0"
async-process = "2.2.2"
async-recursion = "1.1.0"
async_zip = { version = "0.0.17", features = ["full"] }
futures-lite = "2.3.0"
md5 = "0.7.0"
sha1 = "0.10.6"
tokio-util = "0.7.10"
tar = "0.4.46"
flate2 = "1.1.9"
zip = "8.6.0"
sysinfo = "0.39.5"
keyring = "4.1.3"
magic-crypt = "4.0.1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
